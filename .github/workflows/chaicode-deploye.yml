name: Deploy Node Project
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy on Excloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 210.79.129.75
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/DevOps-practice
            git pull origin main
            npm install
            pm2 restart index.js  